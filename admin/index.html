<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KaayLeek Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 260px;
            background: #111118;
            border-right: 1px solid rgba(255,255,255,0.06);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 100;
            transition: transform 0.3s;
        }
        .sidebar-brand {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .sidebar-brand h2 {
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #C17817, #D4972E);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sidebar-brand small {
            color: rgba(255,255,255,0.4);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .sidebar-nav {
            flex: 1;
            padding: 16px 12px;
            overflow-y: auto;
        }
        .nav-section { margin-bottom: 24px; }
        .nav-section-title {
            color: rgba(255,255,255,0.3);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 0 12px;
            margin-bottom: 8px;
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 500;
            transition: all 0.2s;
            margin-bottom: 2px;
        }
        .nav-link:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .nav-link.active { background: rgba(193,120,23,0.15); color: #C17817; }
        .nav-link i { width: 20px; text-align: center; font-size: 0.95rem; }
        .nav-link .badge {
            margin-left: auto;
            background: #dc3545;
            color: #fff;
            font-size: 0.65rem;
            padding: 2px 7px;
            border-radius: 10px;
            font-weight: 600;
        }
        .sidebar-footer {
            padding: 16px 12px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .sidebar-footer a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            border-radius: 10px;
            font-size: 0.85rem;
            transition: all 0.2s;
            cursor: pointer;
        }
        .sidebar-footer a:hover { background: rgba(255,255,255,0.05); color: #fff; }

        /* MAIN */
        .main { flex: 1; margin-left: 260px; min-height: 100vh; }
        .topbar {
            background: rgba(10,10,15,0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .topbar h1 { font-size: 1.3rem; font-weight: 700; }
        .topbar-right { display: flex; align-items: center; gap: 16px; }
        .content { padding: 32px; }

        /* CARDS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s;
        }
        .stat-card:hover { border-color: rgba(193,120,23,0.3); transform: translateY(-2px); }
        .stat-card .icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            margin-bottom: 16px;
        }
        .stat-card .icon.orange { background: rgba(193,120,23,0.15); color: #C17817; }
        .stat-card .icon.green { background: rgba(27,67,50,0.3); color: #4CAF50; }
        .stat-card .icon.blue { background: rgba(33,150,243,0.15); color: #2196F3; }
        .stat-card .icon.purple { background: rgba(156,39,176,0.15); color: #9C27B0; }
        .stat-card .icon.red { background: rgba(220,53,69,0.15); color: #dc3545; }
        .stat-card .icon.teal { background: rgba(0,150,136,0.15); color: #009688; }
        .stat-card .number { font-size: 2rem; font-weight: 800; color: #fff; margin-bottom: 4px; }
        .stat-card .label { color: rgba(255,255,255,0.5); font-size: 0.85rem; }

        /* TABLE */
        .table-container {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            overflow: hidden;
        }
        .table-header {
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .table-header h3 { font-size: 1rem; font-weight: 600; }
        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left;
            padding: 12px 24px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.4);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        td {
            padding: 14px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 0.9rem;
        }
        tr:hover td { background: rgba(255,255,255,0.02); }

        /* BADGES */
        .badge-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-pending { background: rgba(255,193,7,0.15); color: #ffc107; }
        .badge-confirmed { background: rgba(40,167,69,0.15); color: #28a745; }
        .badge-cancelled { background: rgba(220,53,69,0.15); color: #dc3545; }
        .badge-refused { background: rgba(220,53,69,0.15); color: #dc3545; }
        .badge-completed { background: rgba(33,150,243,0.15); color: #2196F3; }
        .badge-delivered { background: rgba(0,150,136,0.15); color: #009688; }
        .badge-preparing { background: rgba(156,39,176,0.15); color: #CE93D8; }
        .badge-approved { background: rgba(40,167,69,0.15); color: #28a745; }
        .badge-hidden { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-whatsapp {
            background: #25D366;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
        }
        .btn-whatsapp:hover { background: #1da851; transform: scale(1.05); }
        .action-group { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }

        /* BUTTONS */
        .btn {
            padding: 8px 16px;
            border-radius: 10px;
            border: none;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary { background: #C17817; color: #fff; }
        .btn-primary:hover { background: #a86510; }
        .btn-success { background: #28a745; color: #fff; }
        .btn-success:hover { background: #218838; }
        .btn-danger { background: #dc3545; color: #fff; }
        .btn-danger:hover { background: #c82333; }
        .btn-sm { padding: 5px 10px; font-size: 0.78rem; }
        .btn-ghost { background: rgba(255,255,255,0.06); color: #fff; }
        .btn-ghost:hover { background: rgba(255,255,255,0.1); }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: #1a1a24;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 32px;
            width: 100%;
            max-width: 640px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal h3 { font-size: 1.2rem; margin-bottom: 24px; }
        .modal .form-group { margin-bottom: 16px; }
        .modal label {
            display: block;
            color: rgba(255,255,255,0.6);
            font-size: 0.8rem;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .modal input, .modal select, .modal textarea {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            font-family: inherit;
        }
        .modal input:focus, .modal select:focus, .modal textarea:focus { border-color: #C17817; }
        .modal textarea { resize: vertical; min-height: 80px; }
        .modal select option { background: #1a1a24; color: #fff; }
        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }
        .img-preview {
            width: 90px; height: 60px; object-fit: cover; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1); margin-bottom: 8px;
        }

        /* RESPONSIVE */
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.3rem;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main { margin-left: 0; }
            .menu-toggle { display: block; }
            .content { padding: 20px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: rgba(255,255,255,0.4);
        }
        .empty-state i { font-size: 2.5rem; margin-bottom: 12px; }
        .empty-state p { font-size: 0.9rem; }

        .settings-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;
        }
    </style>
</head>
<body>
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <h2>KaayLeek</h2>
            <small>Administration</small>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">
                <div class="nav-section-title">Principal</div>
                <a href="/admin/dashboard" class="nav-link active" data-page="dashboard">
                    <i class="fas fa-chart-pie"></i> Tableau de bord
                </a>
            </div>
            <div class="nav-section">
                <div class="nav-section-title">Gestion</div>
                <a href="/admin/menu" class="nav-link" data-page="menu">
                    <i class="fas fa-utensils"></i> Menu / Plats
                </a>
                <a href="/admin/reservations" class="nav-link" data-page="reservations">
                    <i class="fas fa-calendar-check"></i> Réservations
                    <span class="badge" id="badgeReservations" style="display:none"></span>
                </a>
                <a href="/admin/galerie" class="nav-link" data-page="galerie">
                    <i class="fas fa-images"></i> Galerie
                </a>
                <a href="/admin/commandes" class="nav-link" data-page="commandes">
                    <i class="fas fa-shopping-bag"></i> Commandes
                    <span class="badge" id="badgeCommandes" style="display:none"></span>
                </a>
                <a href="/admin/avis" class="nav-link" data-page="avis">
                    <i class="fas fa-star"></i> Avis
                    <span class="badge" id="badgeAvis" style="display:none"></span>
                </a>
            </div>
            <div class="nav-section">
                <div class="nav-section-title">Configuration</div>
                <a href="/admin/parametres" class="nav-link" data-page="parametres">
                    <i class="fas fa-cog"></i> Paramètres du site
                </a>
                <a href="/" class="nav-link" target="_blank">
                    <i class="fas fa-globe"></i> Voir le site
                </a>
            </div>
        </nav>
        <div class="sidebar-footer">
            <a id="btnLogout">
                <i class="fas fa-sign-out-alt"></i> Déconnexion
            </a>
        </div>
    </aside>

    <!-- MAIN -->
    <div class="main">
        <div class="topbar">
            <div style="display:flex;align-items:center;gap:12px;">
                <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 id="pageTitle">Tableau de bord</h1>
            </div>
            <div class="topbar-right">
                <span style="color:rgba(255,255,255,0.5);font-size:0.85rem" id="userDisplay"></span>
            </div>
        </div>
        <div class="content" id="pageContent"></div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalBody"></div>
    </div>

    <script>
    // ========== STATE & HELPERS ==========
    let currentPage = 'dashboard';
    let stats = {};
    const TOKEN_KEY = 'kaayleek_admin_token';
    const RESTAURANT_PHONE = '+221 76 296 79 19';

    function token() { return localStorage.getItem(TOKEN_KEY); }

    async function api(path, options = {}) {
        const headers = Object.assign({}, options.headers || {});
        headers['Authorization'] = 'Bearer ' + token();
        if (options.body && !(options.body instanceof FormData)) {
            headers['Content-Type'] = 'application/json';
        }
        const res = await fetch(path, Object.assign({}, options, { headers }));
        if (res.status === 401) {
            localStorage.removeItem(TOKEN_KEY);
            window.location.href = '/admin/login';
            throw new Error('Non authentifié');
        }
        let data = null;
        try { data = await res.json(); } catch {}
        if (!res.ok) throw new Error((data && data.error) || 'Erreur serveur');
        return data;
    }

    function esc(str) {
        const d = document.createElement('div');
        d.textContent = str == null ? '' : String(str);
        return d.innerHTML;
    }

    function escAttr(str) {
        return (str == null ? '' : String(str)).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ========== AUTH ==========
    async function checkAuth() {
        try {
            const user = await api('/api/auth/me');
            document.getElementById('userDisplay').textContent =
                user.firstname ? (user.firstname + ' ' + (user.lastname || '')) : (user.email || user.role);
            return user;
        } catch {
            return null;
        }
    }

    document.getElementById('btnLogout').addEventListener('click', () => {
        localStorage.removeItem(TOKEN_KEY);
        window.location.href = '/admin/login';
    });

    // ========== MODAL ==========
    function openModal(html) {
        document.getElementById('modalBody').innerHTML = html;
        document.getElementById('modalOverlay').classList.add('show');
    }
    function closeModal() {
        document.getElementById('modalOverlay').classList.remove('show');
    }
    document.getElementById('modalOverlay').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeModal();
    });

    // ========== TOAST ==========
    function toast(msg, type = 'success') {
        const el = document.createElement('div');
        el.style.cssText = `
            position:fixed;top:20px;right:20px;z-index:999;
            padding:14px 24px;border-radius:12px;font-size:0.9rem;font-weight:600;
            animation:slideIn 0.3s;
            background:${type==='success'?'rgba(40,167,69,0.9)':type==='error'?'rgba(220,53,69,0.9)':'rgba(193,120,23,0.9)'};
            color:#fff;backdrop-filter:blur(10px);
        `;
        el.textContent = msg;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 3000);
    }

    // ========== NAVIGATION ==========
    function navigate(page) {
        currentPage = page;
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        const active = document.querySelector('.nav-link[data-page="' + page + '"]');
        if (active) active.classList.add('active');
        document.getElementById('sidebar').classList.remove('open');

        const titles = {
            dashboard: 'Tableau de bord', menu: 'Menu / Plats', reservations: 'Réservations',
            galerie: 'Galerie', commandes: 'Commandes', avis: 'Avis', parametres: 'Paramètres du site'
        };
        document.getElementById('pageTitle').textContent = titles[page] || page;
        renderPage(page);
    }

    async function renderPage(page) {
        const content = document.getElementById('pageContent');
        content.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Chargement...</p></div>';
        try {
            switch(page) {
                case 'dashboard': return renderDashboard(content);
                case 'menu': return renderMenu(content);
                case 'reservations': return renderReservations(content);
                case 'galerie': return renderGalerie(content);
                case 'commandes': return renderCommandes(content);
                case 'avis': return renderReviews(content);
                case 'parametres': return renderSettings(content);
            }
        } catch (e) {
            content.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>' + esc(e.message) + '</p></div>';
        }
    }

    // ========== DASHBOARD ==========
    async function renderDashboard(el) {
        stats = await api('/api/admin/stats');
        if (stats.reservationsPending > 0) {
            document.getElementById('badgeReservations').textContent = stats.reservationsPending;
            document.getElementById('badgeReservations').style.display = '';
        }
        if (stats.ordersPending > 0) {
            document.getElementById('badgeCommandes').textContent = stats.ordersPending;
            document.getElementById('badgeCommandes').style.display = '';
        }
        if (stats.reviewsPending > 0) {
            document.getElementById('badgeAvis').textContent = stats.reviewsPending;
            document.getElementById('badgeAvis').style.display = '';
        }
        el.innerHTML = `
            <div class="stats-grid">
                <div class="stat-card"><div class="icon orange"><i class="fas fa-utensils"></i></div><div class="number">${stats.menuCount ?? 0}</div><div class="label">Plats au menu</div></div>
                <div class="stat-card"><div class="icon red"><i class="fas fa-calendar-day"></i></div><div class="number">${stats.todayReservations ?? 0}</div><div class="label">Réservations aujourd'hui</div></div>
                <div class="stat-card"><div class="icon blue"><i class="fas fa-clock"></i></div><div class="number">${stats.reservationsPending ?? 0}</div><div class="label">Réservations en attente</div></div>
                <div class="stat-card"><div class="icon green"><i class="fas fa-shopping-bag"></i></div><div class="number">${stats.ordersTotal ?? 0}</div><div class="label">Commandes totales</div></div>
                <div class="stat-card"><div class="icon teal"><i class="fas fa-truck"></i></div><div class="number">${stats.ordersToday ?? 0}</div><div class="label">Commandes aujourd'hui</div></div>
                <div class="stat-card"><div class="icon purple"><i class="fas fa-images"></i></div><div class="number">${stats.galleryCount ?? 0}</div><div class="label">Photos galerie</div></div>
                <div class="stat-card"><div class="icon orange"><i class="fas fa-star"></i></div><div class="number">${stats.dishesAvailable ?? 0}</div><div class="label">Plats disponibles</div></div>
                <div class="stat-card"><div class="icon red"><i class="fas fa-calendar-check"></i></div><div class="number">${stats.reservationsTotal ?? 0}</div><div class="label">Réservations totales</div></div>
            </div>
        `;
    }

    // ========== MENU (PLATS) ==========
    async function renderMenu(el) {
        const items = await api('/api/dishes/all');
        el.innerHTML = `
            <div class="table-container">
                <div class="table-header">
                    <h3>${items.length} plat${items.length>1?'s':''}</h3>
                    <button class="btn btn-primary" onclick="showMenuModal()"><i class="fas fa-plus"></i> Ajouter</button>
                </div>
                <table>
                    <thead><tr><th>Image</th><th>Nom</th><th>Catégorie</th><th>Prix</th><th>État</th><th>Actions</th></tr></thead>
                    <tbody>
                        ${items.length === 0 ? '<tr><td colspan="6"><div class="empty-state"><i class="fas fa-utensils"></i><p>Aucun plat</p></div></td></tr>' : ''}
                        ${items.map(i => `
                            <tr>
                                <td>${i.image ? '<img src="' + escAttr(i.image) + '" style="width:70px;height:46px;object-fit:cover;border-radius:8px">' : '<span style="color:rgba(255,255,255,0.3)">—</span>'}</td>
                                <td><strong>${esc(i.name)}</strong></td>
                                <td>${esc(i.category)}</td>
                                <td><strong>${Number(i.price).toLocaleString()} FCFA</strong></td>
                                <td>${i.available ? '<span class="badge-status badge-confirmed">Disponible</span>' : '<span class="badge-status badge-cancelled">Indisponible</span>'}</td>
                                <td>
                                    <button class="btn btn-ghost btn-sm btn-edit-menu" data-item='${escAttr(JSON.stringify(i))}'><i class="fas fa-edit"></i></button>
                                    <button class="btn btn-danger btn-sm btn-delete-menu" data-id="${i.id}"><i class="fas fa-trash"></i></button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
    }

    async function uploadImage(file) {
        if (!file) return null;
        const fd = new FormData();
        fd.append('image', file);
        const data = await api('/api/upload', { method: 'POST', body: fd });
        return data.url;
    }

    function showMenuModal(item = null) {
        openModal(`
            <h3>${item ? 'Modifier' : 'Ajouter'} un plat</h3>
            <form id="menuForm">
                ${item && item.image ? '<img src="' + escAttr(item.image) + '" class="img-preview">' : ''}
                <div class="form-group"><label>Nom</label><input name="name" value="${esc(item?.name||'')}" required></div>
                <div class="form-group"><label>Description</label><textarea name="description">${esc(item?.description||'')}</textarea></div>

    // ========== EVENT DELEGATION ==========
    document.addEventListener('click', (e) => {
        const editBtn = e.target.closest('.btn-edit-menu');
        if (editBtn) {
            try { showMenuModal(JSON.parse(editBtn.dataset.item)); } catch {}
            return;
        }
        const deleteBtn = e.target.closest('.btn-delete-menu');
        if (deleteBtn) { deleteMenu(parseInt(deleteBtn.dataset.id)); return; }

        const confirmResBtn = e.target.closest('.btn-confirm-res');
        if (confirmResBtn) {
            updateReservation(
                parseInt(confirmResBtn.dataset.id), 'confirmed',
                confirmResBtn.dataset.phone, confirmResBtn.dataset.name,
                confirmResBtn.dataset.date, confirmResBtn.dataset.time,
                parseInt(confirmResBtn.dataset.guests)
            );
            return;
        }
        const cancelResBtn = e.target.closest('.btn-cancel-res');
        if (cancelResBtn) {
            updateReservation(
                parseInt(cancelResBtn.dataset.id), 'cancelled',
                cancelResBtn.dataset.phone, cancelResBtn.dataset.name,
                cancelResBtn.dataset.date, cancelResBtn.dataset.time,
                parseInt(cancelResBtn.dataset.guests)
            );
            return;
        }
        const deleteResBtn = e.target.closest('.btn-delete-res');
        if (deleteResBtn) { deleteReservation(parseInt(deleteResBtn.dataset.id)); return; }

        const confirmOrdBtn = e.target.closest('.btn-confirm-ord');
        if (confirmOrdBtn) {
            updateOrder(
                parseInt(confirmOrdBtn.dataset.id), 'confirmed',
                confirmOrdBtn.dataset.phone, confirmOrdBtn.dataset.items,
                parseInt(confirmOrdBtn.dataset.total), confirmOrdBtn.dataset.name
            );
            return;
        }
        const cancelOrdBtn = e.target.closest('.btn-cancel-ord');
        if (cancelOrdBtn) {
            updateOrder(
                parseInt(cancelOrdBtn.dataset.id), 'cancelled',
                cancelOrdBtn.dataset.phone, cancelOrdBtn.dataset.items,
                parseInt(cancelOrdBtn.dataset.total), cancelOrdBtn.dataset.name
            );
            return;
        }
        const completeOrdBtn = e.target.closest('.btn-complete-ord');
        if (completeOrdBtn) {
            updateOrder(
                parseInt(completeOrdBtn.dataset.id), 'completed',
                completeOrdBtn.dataset.phone, completeOrdBtn.dataset.items,
                parseInt(completeOrdBtn.dataset.total), completeOrdBtn.dataset.name
            );
            return;
        }
        const deleteOrdBtn = e.target.closest('.btn-delete-ord');
        if (deleteOrdBtn) { deleteOrder(parseInt(deleteOrdBtn.dataset.id)); return; }

        const deleteGalBtn = e.target.closest('.btn-delete-gal');
        if (deleteGalBtn) { deleteGallery(parseInt(deleteGalBtn.dataset.id)); return; }

        const approveRevBtn = e.target.closest('.btn-approve-rev');
        if (approveRevBtn) { updateReviewStatus(parseInt(approveRevBtn.dataset.id), 'approved'); return; }
        const hideRevBtn = e.target.closest('.btn-hide-rev');
        if (hideRevBtn) { updateReviewStatus(parseInt(hideRevBtn.dataset.id), 'hidden'); return; }
        const deleteRevBtn = e.target.closest('.btn-delete-rev');
        if (deleteRevBtn) { deleteReview(parseInt(deleteRevBtn.dataset.id)); return; }
    });

    // ========== INIT ==========
    (async () => {
        const user = await checkAuth();
        if (user) {
            const page = window.location.pathname.split('/').pop() || 'dashboard';
            navigate(page);
        }
    })();
    </script>
</body>
</html>
