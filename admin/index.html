<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KaayLeek Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 260px;
            background: #111118;
            border-right: 1px solid rgba(255,255,255,0.06);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 100;
            transition: transform 0.3s;
        }
        .sidebar-brand {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .sidebar-brand h2 {
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #C17817, #D4972E);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sidebar-brand small {
            color: rgba(255,255,255,0.4);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .sidebar-nav {
            flex: 1;
            padding: 16px 12px;
            overflow-y: auto;
        }
        .nav-section {
            margin-bottom: 24px;
        }
        .nav-section-title {
            color: rgba(255,255,255,0.3);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 0 12px;
            margin-bottom: 8px;
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 500;
            transition: all 0.2s;
            margin-bottom: 2px;
        }
        .nav-link:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .nav-link.active { background: rgba(193,120,23,0.15); color: #C17817; }
        .nav-link i { width: 20px; text-align: center; font-size: 0.95rem; }
        .nav-link .badge {
            margin-left: auto;
            background: #dc3545;
            color: #fff;
            font-size: 0.65rem;
            padding: 2px 7px;
            border-radius: 10px;
            font-weight: 600;
        }
        .sidebar-footer {
            padding: 16px 12px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .sidebar-footer a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            border-radius: 10px;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .sidebar-footer a:hover { background: rgba(255,255,255,0.05); color: #fff; }

        /* MAIN */
        .main {
            flex: 1;
            margin-left: 260px;
            min-height: 100vh;
        }
        .topbar {
            background: rgba(10,10,15,0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .topbar h1 {
            font-size: 1.3rem;
            font-weight: 700;
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .content {
            padding: 32px;
        }

        /* CARDS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s;
        }
        .stat-card:hover { border-color: rgba(193,120,23,0.3); transform: translateY(-2px); }
        .stat-card .icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            margin-bottom: 16px;
        }
        .stat-card .icon.orange { background: rgba(193,120,23,0.15); color: #C17817; }
        .stat-card .icon.green { background: rgba(27,67,50,0.3); color: #4CAF50; }
        .stat-card .icon.blue { background: rgba(33,150,243,0.15); color: #2196F3; }
        .stat-card .icon.purple { background: rgba(156,39,176,0.15); color: #9C27B0; }
        .stat-card .icon.red { background: rgba(220,53,69,0.15); color: #dc3545; }
        .stat-card .icon.teal { background: rgba(0,150,136,0.15); color: #009688; }
        .stat-card .number {
            font-size: 2rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 4px;
        }
        .stat-card .label {
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
        }

        /* TABLE */
        .table-container {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            overflow: hidden;
        }
        .table-header {
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .table-header h3 {
            font-size: 1rem;
            font-weight: 600;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            text-align: left;
            padding: 12px 24px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.4);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        td {
            padding: 14px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 0.9rem;
        }
        tr:hover td { background: rgba(255,255,255,0.02); }

        /* BADGES */
        .badge-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-pending { background: rgba(255,193,7,0.15); color: #ffc107; }
        .badge-confirmed { background: rgba(40,167,69,0.15); color: #28a745; }
        .badge-cancelled { background: rgba(220,53,69,0.15); color: #dc3545; }
        .badge-completed { background: rgba(33,150,243,0.15); color: #2196F3; }
        .btn-whatsapp {
            background: #25D366;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
        }
        .btn-whatsapp:hover { background: #1da851; transform: scale(1.05); }
        .action-group { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }

        /* BUTTONS */
        .btn {
            padding: 8px 16px;
            border-radius: 10px;
            border: none;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary { background: #C17817; color: #fff; }
        .btn-primary:hover { background: #a86510; }
        .btn-success { background: #28a745; color: #fff; }
        .btn-success:hover { background: #218838; }
        .btn-danger { background: #dc3545; color: #fff; }
        .btn-danger:hover { background: #c82333; }
        .btn-sm { padding: 5px 10px; font-size: 0.78rem; }
        .btn-ghost { background: rgba(255,255,255,0.06); color: #fff; }
        .btn-ghost:hover { background: rgba(255,255,255,0.1); }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: #1a1a24;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 32px;
            width: 100%;
            max-width: 520px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal h3 {
            font-size: 1.2rem;
            margin-bottom: 24px;
        }
        .modal .form-group {
            margin-bottom: 16px;
        }
        .modal label {
            display: block;
            color: rgba(255,255,255,0.6);
            font-size: 0.8rem;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .modal input, .modal select, .modal textarea {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            font-family: inherit;
        }
        .modal input:focus, .modal select:focus, .modal textarea:focus {
            border-color: #C17817;
        }
        .modal textarea { resize: vertical; min-height: 80px; }
        .modal select option { background: #1a1a24; color: #fff; }
        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        /* RESPONSIVE */
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.3rem;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main { margin-left: 0; }
            .menu-toggle { display: block; }
            .content { padding: 20px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: rgba(255,255,255,0.4);
        }
        .empty-state i { font-size: 2.5rem; margin-bottom: 12px; }
        .empty-state p { font-size: 0.9rem; }
    </style>
</head>
<body>
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <h2>KaayLeek</h2>
            <small>Administration</small>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">
                <div class="nav-section-title">Principal</div>
                <a href="/admin/dashboard" class="nav-link active" data-page="dashboard">
                    <i class="fas fa-chart-pie"></i> Tableau de bord
                </a>
            </div>
            <div class="nav-section">
                <div class="nav-section-title">Gestion</div>
                <a href="/admin/menu" class="nav-link" data-page="menu">
                    <i class="fas fa-utensils"></i> Menu / Plats
                </a>
                <a href="/admin/reservations" class="nav-link" data-page="reservations">
                    <i class="fas fa-calendar-check"></i> Réservations
                    <span class="badge" id="badgeReservations" style="display:none"></span>
                </a>
                <a href="/admin/galerie" class="nav-link" data-page="galerie">
                    <i class="fas fa-images"></i> Galerie
                </a>
                <a href="/admin/commandes" class="nav-link" data-page="commandes">
                    <i class="fas fa-shopping-bag"></i> Commandes
                    <span class="badge" id="badgeCommandes" style="display:none"></span>
                </a>
                <a href="/admin/contacts" class="nav-link" data-page="contacts">
                    <i class="fas fa-envelope"></i> Contacts
                </a>
            </div>
            <div class="nav-section">
                <div class="nav-section-title">Site</div>
                <a href="/" class="nav-link" target="_blank">
                    <i class="fas fa-globe"></i> Voir le site
                </a>
            </div>
        </nav>
        <div class="sidebar-footer">
            <a href="#" id="btnLogout">
                <i class="fas fa-sign-out-alt"></i> Déconnexion
            </a>
        </div>
    </aside>

    <!-- MAIN -->
    <div class="main">
        <div class="topbar">
            <div style="display:flex;align-items:center;gap:12px;">
                <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 id="pageTitle">Tableau de bord</h1>
            </div>
            <div class="topbar-right">
                <span style="color:rgba(255,255,255,0.5);font-size:0.85rem" id="userDisplay"></span>
            </div>
        </div>
        <div class="content" id="pageContent"></div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalBody"></div>
    </div>

    <script>
    // ========== STATE ==========
    let currentPage = 'dashboard';
    let stats = {};

    // ========== AUTH ==========
    async function checkAuth() {
        try {
            const res = await fetch('/api/auth/me');
            if (res.status !== 401) {
                const user = await res.json();
                document.getElementById('userDisplay').textContent = user.username;
                return user;
            }
        } catch {}
        window.location.href = '/admin/login';
        return null;
    }

    document.getElementById('btnLogout').addEventListener('click', async () => {
        await fetch('/api/auth/logout', { method: 'POST' });
        window.location.href = '/admin/login';
    });

    // ========== MODAL ==========
    function openModal(html) {
        document.getElementById('modalBody').innerHTML = html;
        document.getElementById('modalOverlay').classList.add('show');
    }
    function closeModal() {
        document.getElementById('modalOverlay').classList.remove('show');
    }
    document.getElementById('modalOverlay').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeModal();
    });

    // ========== TOAST ==========
    function toast(msg, type = 'success') {
        const el = document.createElement('div');
        el.style.cssText = `
            position:fixed;top:20px;right:20px;z-index:999;
            padding:14px 24px;border-radius:12px;font-size:0.9rem;font-weight:600;
            animation:slideIn 0.3s;
            background:${type==='success'?'rgba(40,167,69,0.9)':type==='error'?'rgba(220,53,69,0.9)':'rgba(193,120,23,0.9)'};
            color:#fff;backdrop-filter:blur(10px);
        `;
        el.textContent = msg;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 3000);
    }

    // ========== NAVIGATION ==========
    function navigate(page) {
        currentPage = page;
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        const active = document.querySelector(`.nav-link[data-page="${page}"]`);
        if (active) active.classList.add('active');
        document.getElementById('sidebar').classList.remove('open');

        const titles = { dashboard: 'Tableau de bord', menu: 'Menu / Plats', reservations: 'Réservations', galerie: 'Galerie', commandes: 'Commandes' };
        document.getElementById('pageTitle').textContent = titles[page] || page;
        renderPage(page);
    }

    async function renderPage(page) {
        const content = document.getElementById('pageContent');
        switch(page) {
            case 'dashboard': return renderDashboard(content);
            case 'menu': return renderMenu(content);
            case 'reservations': return renderReservations(content);
            case 'galerie': return renderGalerie(content);
            case 'commandes': return renderCommandes(content);
            case 'contacts': return renderContacts(content);
        }
    }

    // ========== DASHBOARD ==========
    async function renderDashboard(el) {
        const res = await fetch('/api/stats');
        stats = await res.json();
        if (stats.reservationsPending > 0) {
            document.getElementById('badgeReservations').textContent = stats.reservationsPending;
            document.getElementById('badgeReservations').style.display = '';
        }
        if (stats.ordersPending > 0) {
            document.getElementById('badgeCommandes').textContent = stats.ordersPending;
            document.getElementById('badgeCommandes').style.display = '';
        }
        el.innerHTML = `
            <div class="stats-grid">
                <div class="stat-card"><div class="icon orange"><i class="fas fa-utensils"></i></div><div class="number">${stats.menuCount}</div><div class="label">Plats au menu</div></div>
                <div class="stat-card"><div class="icon red"><i class="fas fa-calendar-day"></i></div><div class="number">${stats.todayReservations}</div><div class="label">Réservations aujourd'hui</div></div>
                <div class="stat-card"><div class="icon blue"><i class="fas fa-clock"></i></div><div class="number">${stats.reservationsPending}</div><div class="label">En attente</div></div>
                <div class="stat-card"><div class="icon green"><i class="fas fa-shopping-bag"></i></div><div class="number">${stats.ordersTotal}</div><div class="label">Commandes totales</div></div>
                <div class="stat-card"><div class="icon purple"><i class="fas fa-images"></i></div><div class="number">${stats.galleryCount}</div><div class="label">Photos galerie</div></div>
                <div class="stat-card"><div class="icon teal"><i class="fas fa-calendar-check"></i></div><div class="number">${stats.reservationsTotal}</div><div class="label">Réservations totales</div></div>
            </div>
        `;
    }

    // ========== MENU ==========
    async function renderMenu(el) {
        const res = await fetch('/api/menu');
        const items = await res.json();
        el.innerHTML = `
            <div class="table-container">
                <div class="table-header">
                    <h3>${items.length} plat${items.length>1?'s':''}</h3>
                    <button class="btn btn-primary" onclick="showMenuModal()"><i class="fas fa-plus"></i> Ajouter</button>
                </div>
                <table>
                    <thead><tr><th>Nom</th><th>Catégorie</th><th>Prix</th><th>État</th><th>Actions</th></tr></thead>
                    <tbody>
                        ${items.length === 0 ? '<tr><td colspan="5"><div class="empty-state"><i class="fas fa-utensils"></i><p>Aucun plat</p></div></td></tr>' : ''}
                        ${items.map(i => `
                            <tr>
                                <td><strong>${i.name}</strong></td>
                                <td>${i.category}</td>
                                <td><strong>${i.price.toLocaleString()} FCFA</strong></td>
                                <td>${i.available ? '<span class="badge-status badge-confirmed">Disponible</span>' : '<span class="badge-status badge-cancelled">Indisponible</span>'}</td>
                                <td>
                                    <button class="btn btn-ghost btn-sm" onclick='showMenuModal(${JSON.stringify(i).replace(/'/g,"\\'")})'><i class="fas fa-edit"></i></button>
                                    <button class="btn btn-danger btn-sm" onclick="deleteMenu(${i.id})"><i class="fas fa-trash"></i></button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
    }

    function showMenuModal(item = null) {
        openModal(`
            <h3>${item ? 'Modifier' : 'Ajouter'} un plat</h3>
            <form id="menuForm" enctype="multipart/form-data">
                <div class="form-group"><label>Nom</label><input name="name" value="${item?.name||''}" required></div>
                <div class="form-group"><label>Description</label><textarea name="description">${item?.description||''}</textarea></div>
                <div class="form-group"><label>Prix (FCFA)</label><input type="number" name="price" value="${item?.price||''}" required></div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                    <div class="form-group"><label>Catégorie</label>
                        <select name="category">
                            <option value="entrees" ${item?.category==='entrees'?'selected':''}>Entrées</option>
                            <option value="plats-occidentaux" ${item?.category==='plats-occidentaux'?'selected':''}>Plats Occidentaux</option>
                            <option value="plats-senegalais" ${item?.category==='plats-senegalais'?'selected':''}>Plats Sénégalais</option>
                            <option value="desserts" ${item?.category==='desserts'?'selected':''}>Desserts</option>
                            <option value="boissons" ${item?.category==='boissons'?'selected':''}>Boissons</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Type</label>
                        <select name="type">
                            <option value="occidental" ${item?.type==='occidental'?'selected':''}>Occidental</option>
                            <option value="senegalais" ${item?.type==='senegalais'?'selected':''}>Sénégalais</option>
                            <option value="fusion" ${item?.type==='fusion'?'selected':''}>Fusion</option>
                        </select>
                    </div>
                </div>
                <div class="form-group"><label>Image</label><input type="file" name="image" accept="image/*"></div>
                ${item ? `<div class="form-group"><label><input type="checkbox" name="available" value="1" ${item.available?'checked':''}> Disponible</label></div>` : ''}
                <div class="modal-actions">
                    <button type="button" class="btn btn-ghost" onclick="closeModal()">Annuler</button>
                    <button type="submit" class="btn btn-primary">${item ? 'Modifier' : 'Ajouter'}</button>
                </div>
            </form>
        `);
        document.getElementById('menuForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            if (!fd.has('available')) fd.append('available', '0');
            const url = item ? `/api/menu/${item.id}` : '/api/menu';
            const res = await fetch(url, { method: 'POST', body: fd });
            const data = await res.json();
            if (data.success) { closeModal(); toast(item ? 'Plat modifié' : 'Plat ajouté'); renderPage('menu'); }
            else toast(data.error || 'Erreur', 'error');
        });
    }

    async function deleteMenu(id) {
        if (!confirm('Supprimer ce plat ?')) return;
        const res = await fetch(`/api/menu/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) { toast('Plat supprimé'); renderPage('menu'); }
    }

    // ========== RESERVATIONS ==========
    async function renderReservations(el) {
        const res = await fetch('/api/reservations');
        const items = await res.json();
        el.innerHTML = `
            <div class="table-container">
                <div class="table-header"><h3>${items.length} réservation${items.length>1?'s':''}</h3></div>
                <table>
                    <thead><tr><th>Client</th><th>Date</th><th>Heure</th><th>Convives</th><th>Occasion</th><th>État</th><th>Actions</th></tr></thead>
                    <tbody>
                        ${items.length === 0 ? '<tr><td colspan="7"><div class="empty-state"><i class="fas fa-calendar"></i><p>Aucune réservation</p></div></td></tr>' : ''}
                        ${items.map(i => {
                            const rawPhone = (i.phone || '').replace(/[^0-9]/g, '');
                            const phone = rawPhone.startsWith('221') ? rawPhone : '221' + rawPhone;
                            return `
                            <tr>
                                <td><strong>${i.name}</strong><br><small style="color:rgba(255,255,255,0.4)">${i.phone}</small></td>
                                <td>${i.date}</td>
                                <td>${i.time}</td>
                                <td>${i.guests}</td>
                                <td>${i.occasion || '-'}</td>
                                <td><span class="badge-status badge-${i.status}">${i.status === 'pending' ? 'En attente' : i.status === 'confirmed' ? 'Confirmée' : i.status === 'cancelled' ? 'Annulée' : i.status}</span></td>
                                <td>
                                    <div class="action-group">
                                        ${i.status === 'pending' ? `
                                            <button class="btn btn-success btn-sm" onclick="updateReservation(${i.id},'confirmed',${JSON.stringify(phone)},${JSON.stringify(i.name)},'${i.date}','${i.time}',${i.guests})"><i class="fas fa-check"></i></button>
                                            <button class="btn btn-danger btn-sm" onclick="updateReservation(${i.id},'cancelled',${JSON.stringify(phone)},${JSON.stringify(i.name)},'${i.date}','${i.time}',${i.guests})"><i class="fas fa-times"></i></button>
                                        ` : ''}
                                        ${phone ? `<a href="https://wa.me/${phone}?text=${encodeURIComponent('Bonjour ' + i.name + ' ! Concernant votre réservation du ' + i.date + ' à ' + i.time + ' pour ' + i.guests + ' convive(s)' + (i.occasion ? ' (' + i.occasion + ')' : '') + ' :\n\nKaayLeek 🍽️\n📞 +221 76 296 79 19')} " target="_blank" class="btn-whatsapp" title="Envoyer un message WhatsApp"><i class="fab fa-whatsapp"></i></a>` : ''}
                                        <button class="btn btn-danger btn-sm" onclick="deleteReservation(${i.id})"><i class="fas fa-trash"></i></button>
                                    </div>
                                </td>
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table>
            </div>
        `;
    }

    async function updateReservation(id, status, phone, name, date, time, guests) {
        await fetch(`/api/reservations/${id}`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ status }) });
        toast('Réservation mise à jour');
        renderPage('reservations');
        if (phone && status !== 'pending') {
            const messages = {
                confirmed: 'Bonjour ' + name + ' ! Votre réservation du ' + date + ' à ' + time + ' pour ' + guests + ' convive(s) a été confirmée ✅. Merci et à bientôt !\n\nKaayLeek 🍽️\n📞 +221 76 296 79 19',
                cancelled: 'Désolé ' + name + ', votre réservation du ' + date + ' à ' + time + ' a été annulée ❌. Contactez-nous pour plus d\'infos.\n\nKaayLeek 🍽️\n📞 +221 76 296 79 19'
            };
            if (messages[status]) {
                window.open('https://wa.me/' + phone + '?text=' + encodeURIComponent(messages[status]), '_blank');
            }
        }
    }

    async function deleteReservation(id) {
        if (!confirm('Supprimer cette réservation ?')) return;
        await fetch(`/api/reservations/${id}`, { method: 'DELETE' });
        toast('Réservation supprimée');
        renderPage('reservations');
    }

    // ========== GALERIE ==========
    async function renderGalerie(el) {
        const res = await fetch('/api/gallery');
        const items = await res.json();
        el.innerHTML = `
            <div class="table-container">
                <div class="table-header">
                    <h3>${items.length} photo${items.length>1?'s':''}</h3>
                    <button class="btn btn-primary" onclick="showGalerieModal()"><i class="fas fa-plus"></i> Ajouter</button>
                </div>
                <div style="padding:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px">
                    ${items.length === 0 ? '<div class="empty-state" style="grid-column:1/-1"><i class="fas fa-images"></i><p>Aucune photo</p></div>' : ''}
                    ${items.map(i => `
                        <div style="position:relative;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,0.06)">
                            <img src="${i.image}" alt="${i.title}" style="width:100%;height:160px;object-fit:cover">
                            <div style="padding:10px">
                                <div style="font-size:0.85rem;font-weight:600">${i.title}</div>
                                <div style="font-size:0.75rem;color:rgba(255,255,255,0.4)">${i.category}</div>
                            </div>
                            <button onclick="deleteGallery(${i.id})" style="position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.7);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer"><i class="fas fa-trash" style="font-size:0.7rem"></i></button>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }

    function showGalerieModal() {
        openModal(`
            <h3>Ajouter une photo</h3>
            <form id="galerieForm" enctype="multipart/form-data">
                <div class="form-group"><label>Titre</label><input name="title" required></div>
                <div class="form-group"><label>Catégorie</label>
                    <select name="category">
                        <option value="plat">Plat</option>
                        <option value="ambiance">Ambiance</option>
                        <option value="equipe">Équipe</option>
                        <option value="evenement">Événement</option>
                    </select>
                </div>
                <div class="form-group"><label>Image</label><input type="file" name="image" accept="image/*" required></div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-ghost" onclick="closeModal()">Annuler</button>
                    <button type="submit" class="btn btn-primary">Ajouter</button>
                </div>
            </form>
        `);
        document.getElementById('galerieForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const res = await fetch('/api/gallery', { method: 'POST', body: fd });
            const data = await res.json();
            if (data.success) { closeModal(); toast('Photo ajoutée'); renderPage('galerie'); }
            else toast(data.error || 'Erreur', 'error');
        });
    }

    async function deleteGallery(id) {
        if (!confirm('Supprimer cette photo ?')) return;
        await fetch(`/api/gallery/${id}`, { method: 'DELETE' });
        toast('Photo supprimée');
        renderPage('galerie');
    }

    // ========== COMMANDES ==========
    async function renderCommandes(el) {
        const res = await fetch('/api/orders');
        const items = await res.json();
        el.innerHTML = `
            <div class="table-container">
                <div class="table-header"><h3>${items.length} commande${items.length>1?'s':''}</h3></div>
                <table>
                    <thead><tr><th>#</th><th>Client</th><th>Téléphone</th><th>Articles</th><th>Total</th><th>État</th><th>Actions</th></tr></thead>
                    <tbody>
                        ${items.length === 0 ? '<tr><td colspan="7"><div class="empty-state"><i class="fas fa-shopping-bag"></i><p>Aucune commande</p></div></td></tr>' : ''}
                        ${items.map(i => {
                            let parsedItems = [];
                            try { parsedItems = JSON.parse(i.items); } catch {}
                            const rawPhone = (i.customer_phone || '').replace(/[^0-9]/g, '');
                            const phone = rawPhone.startsWith('221') ? rawPhone : '221' + rawPhone;
                            const itemNames = parsedItems.map(x => x.name + ' x' + x.qty).join(', ') || '-';
                            return `
                            <tr>
                                <td>#${i.id}</td>
                                <td><strong>${i.customer_name}</strong></td>
                                <td>${i.customer_phone}</td>
                                <td>${itemNames}</td>
                                <td><strong>${i.total.toLocaleString()} FCFA</strong></td>
                                <td><span class="badge-status badge-${i.status}">${i.status === 'pending' ? 'En attente' : i.status === 'confirmed' ? 'Confirmée' : i.status === 'completed' ? 'Livrée' : i.status === 'cancelled' ? 'Annulée' : i.status}</span></td>
                                <td>
                                    <div class="action-group">
                                        ${i.status === 'pending' ? `
                                            <button class="btn btn-success btn-sm" onclick="updateOrder(${i.id},'confirmed',${JSON.stringify(phone)},${JSON.stringify(itemNames)},${i.total})"><i class="fas fa-check"></i></button>
                                            <button class="btn btn-danger btn-sm" onclick="updateOrder(${i.id},'cancelled',${JSON.stringify(phone)},${JSON.stringify(itemNames)},${i.total})"><i class="fas fa-times"></i></button>
                                        ` : ''}
                                        ${i.status === 'confirmed' ? `<button class="btn btn-primary btn-sm" onclick="updateOrder(${i.id},'completed',${JSON.stringify(phone)},${JSON.stringify(itemNames)},${i.total})"><i class="fas fa-truck"></i></button>` : ''}
                                        ${phone ? `<a href="https://wa.me/${phone}?text=${encodeURIComponent('Bonjour ' + i.customer_name + ' ! Concernant votre commande #' + i.id + ' (' + itemNames + ' - ' + i.total.toLocaleString() + ' FCFA) :\n\nKaayLeek 🍽️\n📞 +221 76 296 79 19')} " target="_blank" class="btn-whatsapp" title="Envoyer un message WhatsApp"><i class="fab fa-whatsapp"></i></a>` : ''}
                                        <button class="btn btn-danger btn-sm" onclick="deleteOrder(${i.id})"><i class="fas fa-trash"></i></button>
                                    </div>
                                </td>
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table>
            </div>
        `;
    }

    async function updateOrder(id, status, phone, itemNames, total) {
        await fetch(`/api/orders/${id}`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ status }) });
        toast('Commande mise à jour');
        renderPage('commandes');
        if (phone && status !== 'pending') {
            const messages = {
                confirmed: 'Bonjour ' + (i.customer_name || '') + '! Votre commande #' + id + ' (' + itemNames + ' - ' + total.toLocaleString() + ' FCFA) a été confirmée ✅. Merci pour votre confiance !\n\nKaayLeek 🍽️\n📞 +221 76 296 79 19',
                completed: 'Votre commande #' + id + ' est en route de livraison 🚚. Merci de patienter !\n\nKaayLeek 🍽️\n📞 +221 76 296 79 19',
                cancelled: 'Désolé, votre commande #' + id + ' (' + itemNames + ') a été annulée ❌. Contactez-nous pour plus d\'infos.\n\nKaayLeek 🍽️\n📞 +221 76 296 79 19'
            };
            if (messages[status]) {
                window.open('https://wa.me/' + phone + '?text=' + encodeURIComponent(messages[status]), '_blank');
            }
        }
    }

    async function deleteOrder(id) {
        if (!confirm('Supprimer cette commande ?')) return;
        await fetch(`/api/orders/${id}`, { method: 'DELETE' });
        toast('Commande supprimée');
        renderPage('commandes');
    }

    // ========== CONTACTS ==========
    async function renderContacts(el) {
        const res = await fetch('/api/contacts');
        const items = await res.json();
        el.innerHTML = `
            <div class="table-container">
                <div class="table-header"><h3>${items.length} message${items.length>1?'s':''}</h3></div>
                <table>
                    <thead><tr><th>#</th><th>Nom</th><th>Email</th><th>Sujet</th><th>Message</th><th>Date</th><th>Actions</th></tr></thead>
                    <tbody>
                        ${items.length === 0 ? '<tr><td colspan="7"><div class="empty-state"><i class="fas fa-envelope"></i><p>Aucun message</p></div></td></tr>' : ''}
                        ${items.map(i => `
                            <tr>
                                <td>#${i.id}</td>
                                <td><strong>${i.name}</strong></td>
                                <td>${i.email}</td>
                                <td>${i.subject || '-'}</td>
                                <td><small>${i.message.length > 80 ? i.message.substring(0, 80) + '...' : i.message}</small></td>
                                <td><small>${i.created_at}</small></td>
                                <td>
                                    <div class="action-group">
                                        <a href="mailto:${i.email}?subject=Re: ${encodeURIComponent(i.subject || 'Votre message KaayLeek')}" class="btn btn-primary btn-sm" title="Répondre par email"><i class="fas fa-reply"></i></a>
                                        <a href="https://wa.me/?text=${encodeURIComponent('Bonjour ' + i.name + ',\n\nConcernant votre message "' + (i.subject || '') + '" :\n\nKaayLeek 🍽️\n📞 +221 76 296 79 19')}" target="_blank" class="btn-whatsapp" title="Envoyer un message WhatsApp"><i class="fab fa-whatsapp"></i></a>
                                        <button class="btn btn-danger btn-sm" onclick="deleteContact(${i.id})"><i class="fas fa-trash"></i></button>
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
    }

    async function deleteContact(id) {
        if (!confirm('Supprimer ce message ?')) return;
        await fetch(`/api/contacts/${id}`, { method: 'DELETE' });
        toast('Message supprimé');
        renderPage('contacts');
    }

    // ========== INIT ==========
    (async () => {
        const user = await checkAuth();
        if (user) {
            const page = window.location.pathname.split('/').pop() || 'dashboard';
            navigate(page);
        }
    })();
    </script>
</body>
</html>
